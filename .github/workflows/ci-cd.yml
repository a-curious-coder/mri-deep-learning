name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run tests
      run: python -m unittest discover tests

  deploy:
    needs: build-and-test
    runs-on: ubuntu-latest
    # Skip cleanly until the DEPLOY_* secrets are configured, instead of
    # hanging for ~4 minutes trying to SSH to an empty host.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && vars.DEPLOY_ENABLED == 'true'

    steps:
    - uses: actions/checkout@v4

    - name: Build Docker image
      run: docker build -t scanview:latest .

    - name: Render Caddyfile
      env:
        DOMAIN: ${{ secrets.DOMAIN }}
      run: envsubst < deploy/Caddyfile.template > scanview.caddy.rendered

    - name: Deploy to VPS
      env:
        DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
      run: |
        echo "$DEPLOY_KEY" > deploy_key
        chmod 600 deploy_key
        docker save scanview:latest | gzip > scanview.tar.gz

        scp -i deploy_key -o StrictHostKeyChecking=no scanview.tar.gz scanview.caddy.rendered \
          ${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_PATH}/

        ssh -i deploy_key -o StrictHostKeyChecking=no ${DEPLOY_USER}@${DEPLOY_HOST} "
          set -e
          docker load < ${DEPLOY_PATH}/scanview.tar.gz
          docker stop scanview-container || true
          docker rm scanview-container || true
          docker run -d --name scanview-container \
            --restart unless-stopped \
            -p 127.0.0.1:8095:5000 \
            -e DEMO_MODE=true \
            --memory=1536m --memory-swap=1536m --cpus=1.5 \
            scanview:latest
          rm ${DEPLOY_PATH}/scanview.tar.gz

          sudo -n cp ${DEPLOY_PATH}/scanview.caddy.rendered /etc/caddy/sites/scanview.caddy
          sudo -n systemctl reload caddy

          # Each deploy loads a fresh scanview:latest, orphaning the
          # previous image's layers (dangling, untagged). Left unpruned
          # this fills the disk over repeated deploys - already happened
          # once (99% full, 212 accumulated images). -f only removes
          # dangling layers, never anything tagged/in-use by this or any
          # other project on this shared box.
          docker image prune -f
        "
        rm deploy_key scanview.tar.gz scanview.caddy.rendered